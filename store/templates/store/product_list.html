<!DOCTYPE html>
<html>
<head>
    <title>Online Store</title>
</head>
<body>
    <h1>All Products</h1>
    {% for product in products %}
        <div>
            <h2>{{ product.name }}</h2>
            <p>Price: ${{ product.price }}</p>
            <p>Stock: {{ product.stock }}</p>
            <a href="{% url 'product_detail' product.pk %}">View Details</a>
        </div>
        <hr>
    {% empty %}
        <p>No products available.</p>
    {% endfor %}
</body>
</html>
