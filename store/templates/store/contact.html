{% extends 'store/base.html' %}
{% block title %}Contact Us{% endblock %}

{% block content %}
<style>
    .contact-box {
        max-width: 500px;
        margin: 40px auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        padding: 40px;
    }
    .contact-box h1 {
        color: #1F3864;
        margin-bottom: 30px;
    }
    .contact-item {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
        font-size: 16px;
    }
    .contact-item .icon {
        font-size: 28px;
        margin-right: 15px;
    }
    .contact-item p {
        margin: 0;
        color: #333;
    }
    .contact-item span {
        color: #888;
        font-size: 13px;
    }
</style>

<div class="contact-box">
    <h1> Contact Us</h1>

    <div class="contact-item">
        <div class="icon"></div>
        <div>
            <p><strong>Location</strong></p>
            <span>Likoni, Mombasa, Kenya</span>
        </div>
    </div>

    <div class="contact-item">
        <div class="icon"></div>
        <div>
            <p><strong>Email</strong></p>
            <span>xalimkhalid@gmail.com</span>
        </div>
    </div>

    <div class="contact-item">
        <div class="icon"></div>
        <div>
            <p><strong>Phone</strong></p>
            <span>+254 140486853</span>
        </div>
    </div>

    <div class="contact-item">
        <div class="icon"></div>
        <div>
            <p><strong>Working Hours</strong></p>
            <span>Monday - Sunday: 8am to 6pm</span>
        </div>
    </div>
</div>
<a href="{% url 'home' %}">← Back to Home</a>
{%endblock%}
