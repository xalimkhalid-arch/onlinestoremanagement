{% extends 'store/base.html' %}
{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<h1>{{ product.name }}</h1>
<p>{{ product.description }}</p>
<p>Price: KSh {{ product.price }}</p>
<p>Stock: {{ product.stock }}</p>

<a href="{% url 'product_list' %}">← Back to Products</a>
{% endblock %}
